name: Validate

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        env:
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
          NEXT_PUBLIC_HTMT_API_ROOT_SEGMENT: v2
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_SPOTIFY_SCOPES: ci-placeholder
          NEXT_PUBLIC_SPOTIFY_REDIRECT_URI: https://ci.example.com/auth/spotify/callback
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          NEXT_PUBLIC_GOOGLE_REDIRECT_URI: https://ci.example.com/auth/google/callback
          NEXT_PUBLIC_TRACK_UPLOAD_TIMEOUT_MS: "300000"
        run: pnpm run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:coverage -- --passWithNoTests

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
          NEXT_PUBLIC_HTMT_API_ROOT_SEGMENT: v2
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_SPOTIFY_SCOPES: ci-placeholder
          NEXT_PUBLIC_SPOTIFY_REDIRECT_URI: https://ci.example.com/auth/spotify/callback
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          NEXT_PUBLIC_GOOGLE_REDIRECT_URI: https://ci.example.com/auth/google/callback
          NEXT_PUBLIC_TRACK_UPLOAD_TIMEOUT_MS: "300000"
        run: pnpm run build

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-check
    permissions:
      contents: write
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-github.yml@79c136234b5d487bb99e0cd2050f38f6b3e06747
